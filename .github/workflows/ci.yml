# Continuous integration for Cat Splat Engine.
#
# The repository had 993 tests and nothing that ran them. This is the smallest
# pipeline that makes that untrue, structured so the REQUIRED check is the one
# that can actually stay green:
#
#   determinism-flags (required)  seconds, no toolchain: proves no fast-math flag
#                         has crept into the build. Runs first because it is the
#                         property everything else rests on. It also carries the
#                         DOCUMENTATION gate (scripts/check_docs.py) for the same
#                         reason -- no toolchain, reports before the long jobs
#                         have finished restoring their caches. The job's name is
#                         left alone deliberately: it is the identity branch
#                         protection was configured against, and renaming it is a
#                         repository-settings change, not a workflow edit.
#   windows  (required)   all four configurations build, the same flag gate runs
#                         again over the GENERATED compile lines, then the 42
#                         CTest entries that need no GPU.
#   gl-tests (required)   the 11 tests that need an OpenGL context, run against
#                         Mesa's llvmpipe software rasteriser.
#   linux    (required)   the Linux port compiles under gcc 13 AND runs the same
#                         test suite. That second half is what makes the
#                         cross-toolchain determinism gate real: a golden state
#                         hash checked by one compiler proves only that the
#                         compiler agrees with itself.
#
# ALL FOUR ARE REQUIRED as of 2026-08-12. gl-tests and linux started advisory —
# the idea being to promote each once it had been green for a while — and both
# have earned it: linux ran 10 consecutive green including a run where gcc built
# the vendored GekkoNet, and gl-tests 11 of 12.
#
# The one gl-tests failure is why this note exists rather than a shorter one. It
# was not a GL problem and not a code problem: `vcpkg z-applocal` hit "Access is
# denied." while linking test_ui_binding.exe, because vcpkg deploys DLLs
# per-executable and ~45 parallel links were copying the same files into the same
# directory. Promoting a job with a live race in it would have converted a rare
# annoyance into a rare hard stop, so the race was fixed first —
# VCPKG_APPLOCAL_DEPS is now OFF for tests, since test_runtime_deps already
# stages a superset from a single target (see tests/CMakeLists.txt).
#
# Worth keeping in mind that nobody noticed that failure for five runs, because
# advisory failures do not announce themselves. That is the cost of the advisory
# state and the reason to leave it promptly.
#
# If a required job starts failing, the finding is the point: record it and fix
# the cause. Do not reach for continue-on-error to make the red go away.
#
# Only first-party actions (checkout, cache) are used. The MSVC environment
# comes from vswhere + vcvars64 rather than a third-party action, because a
# build pipeline is a supply-chain surface and this one is cheap to own.
# It is behind scripts/ci/msvc_env.cmd, which exists because the inline `for /f`
# it replaces ran its body zero times and SUCCEEDED when vswhere printed
# nothing -- see the header of that file for the run it cost us.
#
# vcpkg builds Assimp, Jolt, PhysX, Lua and friends from source: slow once, fast
# forever after. The binary cache is what makes this viable -- check cache hit
# rates before blaming the compiler.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref. Never cancel master:
  # its runs populate the vcpkg cache every other run restores from.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Runs in seconds and needs no toolchain, so it reports before the long jobs
  # have finished restoring their caches. Determinism is the property the whole
  # fighting-game plan rests on (docs/ARCHITECTURE.md D3), and a single
  # /fp:fast silently voids it while every test stays green.
  determinism-flags:
    name: Determinism · FP flag gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self-test the detector
        # A gate nobody has watched fail is not a gate. This proves every
        # pattern still matches before trusting a green result from it.
        run: python scripts/check_determinism_flags.py --self-test
      - name: Scan the authored build configuration
        # Generated build files do not exist here (nothing has been configured),
        # so this covers CMakeLists/presets/cmake only. The windows job below
        # runs the same script again AFTER configuring, which adds the generated
        # compile lines -- that is where a dependency's INTERFACE option would
        # show up.
        run: python scripts/check_determinism_flags.py

      - name: Self-test the documentation gate
        # Kept as its own step now that the scan below is required too. A
        # detector that has stopped detecting reports a clean documentation
        # tree, and a green scan is only worth what this step says it is --
        # so when both fail, read this one first: it names the probe.
        run: python scripts/check_docs.py --self-test

      - name: Documentation — dead links, dead paths, missing stamps
        # REQUIRED as of M0.6. It was advisory for exactly four commits, which is
        # the whole of its intended life: its first run reported 78 findings and
        # that list WAS the work M0.4-M0.6 did. It reports zero now.
        #
        # It stayed advisory no longer than that on purpose. This repository has
        # already paid for the alternative -- gl-tests failed five consecutive
        # runs while advisory and nobody noticed, because advisory failures do
        # not announce themselves.
        #
        # If this fails: it does not detect a stale CLAIM, only the mechanical
        # residue of one. A dead link, a path that no longer exists, a missing
        # `Verified:` stamp, an AMENDED block bolted onto a living document. Each
        # is a fact about the filesystem, so each has a fix rather than an
        # opinion. `docs-ok` in a comment on the line, with a reason, is the
        # escape for the deliberately absent.
        run: python scripts/check_docs.py

      - name: The clips gate — exported animations carry the frame counts the data says
        # ROADMAP M3.3a / ADR-019 D2. Reads the committed Blender-exported paddle
        # (tests/fixtures/models/paddle_blender.gltf) with the standard library
        # and first proves the detector refuses a count/span disagreement. CI
        # has no Blender and never needs one: the witness is the committed file.
        run: python scripts/check_clips.py --self-test

  windows:
    name: Windows · build + test
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg_cache,readwrite'
    steps:
      - name: Enable long paths
        # vcpkg buildtrees nest deeply enough to trip MAX_PATH; draco has bitten
        # this repository before.
        shell: cmd
        run: |
          git config --system core.longpaths true
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - uses: actions/checkout@v4
        with:
          # ThirdParty/GekkoNet is a pinned submodule (docs/adr/ADR-003).
          # Without this the build fails at configure with the
          # "is empty" message in ThirdParty/CMakeLists.txt.
          submodules: recursive

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          # vcpkg.json pins WHAT is built; vcpkg-configuration.json pins the
          # baseline it is built from. Either changing invalidates the cache.
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-

      - name: Prepare environment
        shell: cmd
        # The presets read CSE_VCPKG_ROOT (see CMakePresets.json "base"); the
        # runner ships a vcpkg at VCPKG_INSTALLATION_ROOT.
        #
        # `if not exist` rather than `mkdir ... 2>nul`: cmd's mkdir sets
        # ERRORLEVEL 1 when the directory is already there, `2>nul` hides the
        # MESSAGE but not the exit code, and a later successful `echo` does not
        # clear it -- so the step fails. That made this job pass on a cache MISS
        # and fail on every cache HIT, which is exactly what happened between the
        # first and second CI runs.
        run: |
          if not exist vcpkg_cache mkdir vcpkg_cache
          echo CSE_VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%>> %GITHUB_ENV%

      # The tests configuration first: it is the one that fails informatively,
      # and it warms the vcpkg cache for the three that follow.
      - name: Configure and build (tests)
        shell: cmd
        run: |
          call scripts\ci\msvc_env.cmd || exit /b 1
          cmake --preset x64-relwithdebinfo-tests || exit /b 1
          cmake --build --preset x64-relwithdebinfo-tests || exit /b 1

      - name: Determinism — FP flags in the GENERATED build files
        shell: cmd
        # The half the standalone job cannot do: build.ninja and
        # compile_commands.json now exist, so this sees the actual compile lines
        # including anything a vcpkg dependency exported as an INTERFACE option.
        # That propagation is not hypothetical here -- Jolt::Jolt's
        # _HAS_EXCEPTIONS=0 reached every engine TU this way once.
        run: python scripts/check_determinism_flags.py

      - name: Test — everything that does not need a GPU
        shell: cmd
        working-directory: out/build/x64-relwithdebinfo-tests
        # `perf` is a timing budget that means nothing on a shared CI vCPU;
        # `gl` needs an OpenGL context this runner does not have. Both run
        # elsewhere: perf locally, gl in the job below.
        run: ctest --output-on-failure -LE "perf|gl" -j 4

      - name: What was actually staged
        if: failure()
        shell: cmd
        # A missing DLL surfaces as `SEH exception with code 0xc06d007e`
        # (ERROR_MOD_NOT_FOUND) followed by a cascade of "resource deadlock would
        # occur" from the std::call_once it poisoned -- and names no file. This
        # runner and a developer machine disagreed once about which DLLs vcpkg's
        # applocal deployment produces, and settling that cost a round trip
        # because neither directory listing existed. Now it does.
        run: |
          echo === beside the test executables ===
          dir /b out\build\x64-relwithdebinfo-tests\tests\*.dll
          echo === beside Engine.dll ===
          dir /b out\build\x64-relwithdebinfo-tests\build\bin\RelWithDebInfo\*.dll
          echo === what vcpkg installed ===
          dir /b out\build\x64-relwithdebinfo-tests\vcpkg_installed\x64-windows\bin\*.dll

      - name: Build the shipping configurations
        shell: cmd
        # Build-only, and not redundant: a missing symbol shows up when the
        # Player links, not when the Engine does, and the tests configuration
        # does not build the Player.
        run: |
          call scripts\ci\msvc_env.cmd || exit /b 1
          cmake --preset x64-debug              || exit /b 1
          cmake --build --preset x64-debug      || exit /b 1
          cmake --preset x64-release            || exit /b 1
          cmake --build --preset x64-release    || exit /b 1
          cmake --preset x64-relwithdebinfo     || exit /b 1
          cmake --build --preset x64-relwithdebinfo || exit /b 1

  gl-tests:
    name: Windows · GL tests (llvmpipe)
    runs-on: windows-2022
    timeout-minutes: 150
    # REQUIRED since 2026-08-12. Software-rasterising an 11-pass pipeline is
    # still the slowest thing here (~9 minutes, consistently), and it was the
    # likeliest flake candidate — but the one failure it had was a vcpkg
    # applocal copy race that is now fixed at the source, not a GL problem. If
    # llvmpipe itself ever turns flaky, pin the Mesa hash (the download is
    # version-pinned but its hash is only printed, see the install step below)
    # before considering demotion.
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg_cache,readwrite'
    steps:
      - name: Enable long paths
        shell: cmd
        run: |
          git config --system core.longpaths true
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - uses: actions/checkout@v4
        with:
          # ThirdParty/GekkoNet is a pinned submodule (docs/adr/ADR-003).
          # Without this the build fails at configure with the
          # "is empty" message in ThirdParty/CMakeLists.txt.
          submodules: recursive

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-

      - name: Prepare environment
        shell: cmd
        # See the windows job for why this is `if not exist` and not
        # `mkdir ... 2>nul`.
        run: |
          if not exist vcpkg_cache mkdir vcpkg_cache
          echo CSE_VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%>> %GITHUB_ENV%

      - name: Configure and build
        shell: cmd
        run: |
          call scripts\ci\msvc_env.cmd || exit /b 1
          cmake --preset x64-relwithdebinfo-tests || exit /b 1
          cmake --build --preset x64-relwithdebinfo-tests || exit /b 1

      - name: Install Mesa llvmpipe beside the test binaries
        shell: pwsh
        # A GitHub runner has no GPU and no OpenGL ICD, so glfwCreateWindow with
        # a 3.3 core profile fails outright. Mesa's llvmpipe is a complete
        # software GL implementation; putting its opengl32.dll next to the
        # executables makes the loader prefer it over the system stub.
        #
        # Pinned by tag. The hash is PRINTED, not asserted, because this is an
        # advisory job -- if you promote it to required, capture the hash here
        # and fail on a mismatch first.
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '24.3.4'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$ver/mesa3d-$ver-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          Write-Host "mesa3d $ver sha256=$((Get-FileHash mesa.7z -Algorithm SHA256).Hash)"
          7z x mesa.7z -omesa | Out-Null
          $dest = 'out/build/x64-relwithdebinfo-tests/tests'
          Get-ChildItem -Path mesa -Recurse -Filter 'opengl32.dll' |
            Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1 |
            ForEach-Object { Copy-Item $_.FullName $dest -Force; Write-Host "installed $($_.FullName)" }
          foreach ($dll in 'libgallium_wgl.dll', 'libglapi.dll', 'dxil.dll') {
            Get-ChildItem -Path mesa -Recurse -Filter $dll -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } |
              Select-Object -First 1 |
              ForEach-Object { Copy-Item $_.FullName $dest -Force }
          }

      - name: Test — the GL suites
        shell: cmd
        working-directory: out/build/x64-relwithdebinfo-tests
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        # `perf` stays excluded: llvmpipe would blow every budget in the file and
        # tell us nothing about the shipping target.
        run: ctest --output-on-failure -L gl -LE perf

  linux:
    name: Linux · compiles
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # REQUIRED since 2026-08-12. README.md described Linux as "compiles under
    # gcc/clang" and nothing checked it; the first run of this job found that it
    # did not (a nested struct's default member initialisers used from a default
    # argument — see docs/ARCHITECTURE.md). It does now, and this job is what
    # keeps that true: there is no gcc on the primary development machine, so
    # this runner is the ONLY compiler that ever sees the code that is not MSVC.
    #
    # It now also RUNS the tests, which is what makes the cross-toolchain
    # determinism gate mean anything: test_determinism_crossplat asserts a golden
    # state hash, and a golden hash checked by one compiler proves only that the
    # compiler agrees with itself. gcc checking the SAME constant is the
    # comparison — no test binary can compare itself to another platform.
    #
    # The Windows-shaped path assertions that blocked this are guarded as of
    # 367ba5d (see docs/MAINTENANCE.md and the #ifdef _WIN32 blocks in
    # test_scene_serializer / test_ui_markup / test_ibl / test_ui_component).
    steps:
      - uses: actions/checkout@v4
        with:
          # ThirdParty/GekkoNet is a pinned submodule (docs/adr/ADR-003).
          # Without this the build fails at configure with the
          # "is empty" message in ThirdParty/CMakeLists.txt.
          submodules: recursive

      - name: System packages
        # GLFW needs the X11 development headers; see docs/manual/getting-started.md.
        #
        # TIMED, RETRIED AND NON-INTERACTIVE, because all three have now cost a
        # run. This step hung for 2h05m on 2026-08-18 and would have burned the
        # job's whole 150-minute budget: apt was waiting on something -- a
        # stalled mirror, a dpkg lock, a prompt -- with no deadline of its own,
        # so a REQUIRED job sat "in progress" while the other three had long
        # since gone green. A hang is worse than a failure: red says look at me,
        # and a hang says nothing at all.
        #
        # Ten minutes is roughly 10x the normal cost of this step, so the
        # deadline only fires on a genuine stall.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive   # never wait for a prompt nobody can answer
        run: |
          # The runner ships third-party apt sources (packages.microsoft.com,
          # azure-cli) that this project never installs from, and `apt-get
          # update` exits non-zero if ANY configured repository fails. One of
          # them started returning 403 Forbidden and took the whole job down
          # before a single line was compiled -- a failure with nothing to do
          # with the code, on a job whose entire purpose is to report on the
          # code. Dropping them removes that class of flake without weakening
          # the check: an Ubuntu archive failure still fails the step loudly.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          # Retries and a per-connection timeout: apt's own default is to wait,
          # which is the behaviour being corrected here.
          APT_OPTS='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y ninja-build xorg-dev libgl1-mesa-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev \
            autoconf automake libtool pkg-config

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-

      - name: Toolchain versions
        # Printed up front so a failure below can be read against them. The
        # vcpkg baseline is pinned (vcpkg-configuration.json) while the runner's
        # compiler is not, and an old baseline meeting a new GCC is the single
        # most likely reason for this job to fail.
        run: |
          gcc --version | head -1
          cmake --version | head -1
          ninja --version
          echo "vcpkg: $VCPKG_INSTALLATION_ROOT"
          git -C "$VCPKG_INSTALLATION_ROOT" rev-parse --short HEAD 2>/dev/null || true

      - name: Build
        id: linux_build
        # NOT a preset: CMakePresets.json is deliberately gated to Windows hosts
        # (see the windows-base condition). scripts/linux-build.sh is the
        # committed Linux equivalent, so exercising it here keeps the script and
        # CI from drifting apart.
        run: |
          mkdir -p vcpkg_cache
          export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          export VCPKG_BINARY_SOURCES="clear;files,$GITHUB_WORKSPACE/vcpkg_cache,readwrite"
          # Report every compile error, not just the first failing batch. There
          # is no Linux machine behind this port -- this runner is the only
          # compiler that ever sees the code -- so a truncated error list costs a
          # full 10-minute round trip per error.
          export CSE_KEEP_GOING=1
          chmod +x scripts/linux-build.sh
          scripts/linux-build.sh RelWithDebInfo 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Test — the same suite Windows runs
        working-directory: out/build/linux-RelWithDebInfo
        # THE POINT OF THIS STEP is test_determinism_crossplat. Everything else
        # here is a bonus: this is the first time the suite has ever run on
        # anything but MSVC, so treat new failures as findings about the port
        # rather than as flakes.
        #
        # `gl` is excluded because this runner has no OpenGL context (the Windows
        # gl-tests job covers those under Mesa). `perf` is a timing budget that
        # means nothing on a shared vCPU.
        run: ctest --output-on-failure -LE "perf|gl" -j 4

      - name: Do the two toolchains agree?
        if: always()
        # Printed unconditionally, pass or fail, because this is the claim the
        # whole fighting-game plan rests on and it should be readable without
        # digging through a test log. The hash below is recorded in
        # tests/test_determinism_crossplat.cpp from an MSVC run; if gcc computed
        # a different one the test above has already failed and named the first
        # diverging checkpoint.
        working-directory: out/build/linux-RelWithDebInfo
        run: |
          echo "=== cross-toolchain determinism ==="
          ./tests/test_determinism_crossplat --gtest_filter='*RecordedValue*' 2>&1 | tail -20 || true

      - name: Why it failed
        if: failure()
        # Two different failures wear the same "exit code 1", and they want
        # opposite diagnostics:
        #
        #   a dependency failed to build -> the answer is in vcpkg's buildtree
        #     logs, which vcpkg names in its output and the runner then throws
        #     away with the container. That is what the first run of this job
        #     produced: nothing but the exit code.
        #   OUR code failed to compile -> the answer is already above, but buried.
        #     With -k 0 there may be a hundred lines of it, most of them the same
        #     header reported once per translation unit.
        #
        # So: lead with a deduplicated list of the distinct compiler errors, and
        # only reach for the vcpkg logs when there are none.
        run: |
          echo "===== distinct compiler errors ====="
          if [ ! -f build.log ]; then
            # The build step never got as far as running the compiler -- it died
            # in setup. Say that, instead of reporting "no compile errors", which
            # is technically true and thoroughly misleading. This exact case
            # happened: an apt mirror 403'd and the summary announced that this
            # was not a compile failure, which read like the build had succeeded.
            echo "build.log does not exist: the build never started."
            echo "The failure is in a step ABOVE this one -- read that step's log."
            exit 0
          fi
          if grep -qE '^[^ ]+:[0-9]+:[0-9]+: (error|fatal error):' build.log; then
            grep -hoE '[^/ ]+:[0-9]+:[0-9]+: (error|fatal error):.*' build.log |
              sort -u | head -80
            echo
            echo "(deduplicated by file:line — a header error repeats once per TU)"
            echo "TOTAL distinct: $(grep -hoE '[^/ ]+:[0-9]+:[0-9]+: (error|fatal error):.*' build.log | sort -u | wc -l)"
          else
            echo "none — this was not a compile failure. Dependency logs follow."
            echo "===== vcpkg buildtree logs ====="
            find "$VCPKG_INSTALLATION_ROOT/buildtrees" -name '*-err.log' -o -name '*-out.log' 2>/dev/null |
              head -20 | while read -r f; do
                echo "----- $f -----"
                tail -60 "$f"
              done
            echo "===== CMake logs ====="
            find out/build -name 'CMakeError.log' -o -name 'CMakeOutput.log' 2>/dev/null |
              while read -r f; do
                echo "----- $f -----"
                tail -60 "$f"
              done
          fi
